[package]
name = "chief"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
agentusage = { path = "vendor/agentusage" }
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
glob = "0.3"
md5 = "0.7"
minijinja = "2.5"
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "process", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.12", features = ["v4", "serde"] }

[[bin]]
name = "chief"
path = "src/bin/chief.rs"

[[bin]]
name = "chief_backend"
path = "src/bin/chief_backend.rs"

chief:
  # Flow to run (`loop_file` or `refactor`).
  flow: loop_file # loop_file requires `chief --file <path>` (or `chief loop_file --file <path>`)
  # Agent binary to use (`codex`, `claude`, `opencode`, or `cursor-agent`; `cursor` is also accepted).
  agent: codex
  # Model override passed to the selected agent (for `cursor-agent`, use Cursor's exact model id such as `gpt-5.4-xhigh`).
  # model: gpt-5
  # Cursor example: use the exact Cursor model id in `model`.
  # agent: cursor-agent
  # model: gpt-5.4-xhigh
  # Reasoning effort for model adapters that support it (`low`, `medium`, `high`, or `xhigh`).
  # model_reasoning_effort: high
  # Extra CLI args forwarded to the selected agent (YAML/JSON string list).
  agent_extra_args: []
  # Chief-managed MCP server config as a YAML/JSON object (`{}` means no servers).
  # Default from `chief init`: chief owns the MCP set and starts with none.
  # Delete this key entirely to leave the agent MCP config untouched.
  mcp_servers: {}
  # Define servers below to let chief translate the same config for
  # Claude, Codex, or Cursor.
  # mcp_servers:
  #   context7:
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "@upstash/context7-mcp"]
  #     env: {}
  #   sentry:
  #     transport: streamable_http
  #     url: https://mcp.sentry.dev/mcp
  #     auth:
  #       type: jwt
  #       token_env_var: SENTRY_TOKEN
  # Retry budget for queued todo flows (minimum effective value is 1).
  max_retries: 2
  # Maximum convergence iterations for loop-style flows.
  max_loop_iterations: 20
  # Consecutive stable iterations required before convergence is done.
  required_stable_iterations: 2
  # Additional glob patterns to exclude from convergence change detection (repeatable).
  change_exclude: []
  # Per-agent invocation timeout in seconds (0 disables timeout).
  agent_timeout_seconds: 2700
  # Fixed wait in seconds between agent calls; when set, it overrides respect_limits logic (0 means no wait).
  # agent_wait_seconds: 60
  # Default timeout in seconds for suite/readiness commands.
  suite_command_timeout_seconds: 1800
  # Tail line count kept when truncating agent output in logs.
  agent_log_max_output_lines: 10
  # Tail character count kept when truncating agent output in logs.
  agent_log_max_output_chars: 1500
  # When true, wait for agentusage limits before launching agent calls.
  respect_limits: true
  # When true, apply agent log truncation to stdout log output too.
  use_agent_log_truncation_for_stdout_logs: false
  # Print raw live agent output, including JSON event streams from JSON-mode agents.
  verbose: false

suites:
  # Execution model:
  # - Each todo runs in its own temporary git worktree (isolated from your main checkout).
  # - Optional cache_paths are snapshotted on successful pre-run checks and then copied/symlinked
  #   into each fresh todo worktree according to cache_mode.
  # - Optional cleanup_command runs after each test_command attempt (pass/fail/timeout/cancel).
  #
  # -----------------------------
  # Rust project suite
  # -----------------------------
  - name: backend
    language: Rust
    framework: cargo test
    test_root: .
    test_command: cargo test
    target_type: project
    default_target: .
    file_patterns: []
    lint_command: cargo clippy
    # lint_fix_command: cargo fmt
    post_green_command: cargo test
    # cleanup_command: pkill -f "cargo test.*$PWD" || true
    # Optional worktree dependency cache (snapshotted during successful pre-run checks)
    # and re-hydrated into each fresh todo worktree.
    # cache_paths: [target]
    # cache_key_files: [Cargo.lock]
    # cache_mode: copy # optional: copy (default) or symlink
    # command_timeout_seconds: 1800 # optional per-suite override (seconds)
    env: {}
    strip_root_from_target: true


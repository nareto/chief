services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        CHIEF_BACKEND_URL: http://host.docker.internal:8000
        NEXT_PUBLIC_CHIEF_WS_BASE: ws://localhost:8000
    environment:
      CHIEF_BACKEND_URL: http://host.docker.internal:8000
      NEXT_PUBLIC_CHIEF_WS_BASE: ws://localhost:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
